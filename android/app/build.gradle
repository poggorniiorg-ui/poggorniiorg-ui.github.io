plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.kmz1.zakaz'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.kmz1.zakaz'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
